[project]
name = "rutanorte-logistics"
version = "1.0.0"
description = "PIA - Componentes de Lógica de Negocio - RutaNorte Logistics"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requiere TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
