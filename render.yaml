# Blueprint de Render: base PostgreSQL + servicio web con la imagen de este repositorio.
# Render > New > Blueprint > seleccionar el repositorio. La URL pública queda en https://<servicio>.onrender.com
databases:
  - name: rutanorte-db
    databaseName: rutanorte
    plan: free

services:
  - type: web
    name: rutanorte-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rutanorte-db
          property: connectionString
      - key: APP_ENV
        value: produccion
      - key: LOG_LEVEL
        value: INFO
      - key: ROLES_QUE_CANCELAN
        value: Operaciones
